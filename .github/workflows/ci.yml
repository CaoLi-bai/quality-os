name: quality-os-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest
      - run: python -m quality_os.cli eval --output-dir artifacts/evals --trials 3
      - run: python -m quality_os.cli run --provider fixture --run-id ci
      - uses: actions/upload-artifact@v4
        with:
          name: quality-os-evidence
          path: artifacts/
