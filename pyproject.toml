[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-os-demo"
version = "0.2.0"
description = "Evidence-first AI agent testing with real browser exploration, independent challenge and regression memory"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Cao Li"}]
keywords = ["ai-testing", "agent", "playwright", "quality-assurance", "evaluation"]
dependencies = []

[project.urls]
Repository = "https://github.com/CaoLi-bai/quality-os"
Issues = "https://github.com/CaoLi-bai/quality-os/issues"
Changelog = "https://github.com/CaoLi-bai/quality-os/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "playwright>=1.50",
]

[project.scripts]
quality-os = "quality_os.cli:main"
demo-app = "demo_app.server:main"

[tool.setuptools.packages.find]
include = ["quality_os*", "demo_app*"]

[tool.setuptools.package-data]
demo_app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: real browser end-to-end tests",
]
